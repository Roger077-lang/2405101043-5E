<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
            text-align: left;
        }
        table.names {
            width: 100%;
            background-color: #f1f1c1;
        }
    </style>
</head>
<body>
    <table style="width: 1000%">
        <tr>
            <th> First Name </th>
            <th> Last Name </th>
            <th> Age </th>
        </tr>
        <tr>
            <th> Roger </th>
            <th> Nugraha </th>
            <th> 22 </th>
        </tr>
    </table>
    <br>

    <table class="names">
        <tr>
            <th> First Name </th>
            <th> Last Name </th>
            <th> Age </th>
        </tr>
        <tr>
            <th> Roger </th>
            <th> Nugraha </th>
            <th> 22 </th>
        </tr>
    </table>
</body>
</html>
