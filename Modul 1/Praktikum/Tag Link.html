<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Penggunaan Tag Link </title>
</head>
<body>
    <h1> Belajar Tag line </h1>
    <p> Saya Sedang Belajar HTML Di 
        <a href="http://www.unipma.ac.id"> Universitas PGRI Madiun </a>
    </p>

    <h1> Belajar Tag line </h1>
    <p> Saya Sedang Belajar HTML Di 
        <a href="hello.html"> Hello </a>
    </p>

    <h1> Belajar Tag line Target </h1>
    <p> Saya Sedang Belajar HTML Di 
        <a href="http://www.unipma.ac.id"
        target="_blank"> Universitas PGRI Madiun </a> dan akan terbuka pada tab baru
    </p>
</body>
</html>
