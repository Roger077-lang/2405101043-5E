<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Belajar membuat Form </title>
</head>
<body>
    <form action="Formulir.html" method="get">
        <label for="nama"> Nama : </label>
        <input type="text" id="nama" name="nama" value="Nama Kamu" />
        <br/><br/>

        <label for="password"> Password : </label>
        <input type="password" id="password" name="password" />
        <br/><br/>

        Jenis Kelamin :
        <input type="radio" name="jenis_kelamin" value="laki-laki" checked/> 
        Laki-Laki
        <input type="radio" name="jenis_kelamin" value="perempuan" />
        Perempuan
        <br/><br/>

        Hobi :
        <input type="checkbox" name="hobi_baca" /> Membaca Buku
        <input type="checkbox" name="hobi_nulis" checked /> Menulis
        <input type="checkbox" name="hobi_mancing" /> Memancing
        <br/><br/>

        Asal Kota :
        <select name="asal_kota">
            <option value="Kota Jakarta"> Jakarta </option>
            <option value="Bandung"> Bandung </option>
            <option value="Kota Semarang" selected> Semarang </option>
        </select>
        <br/><br/>

        <label for="komentar"> Komentar Anda : </label>
        <br/>
        <textarea id="komentar" name="komentar" rows="5" cols="20">
            Silahkan katakan isi hati anda
        </textarea>
        <br/><br/>
        
        <input type="submit" value="Mulai Proses!">
    </form>
</body>
</html>
