<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulir Klinik Sehat </title>
</head>
<body>
    <h1> Formulir Pendaftaran </h1>

    <form action="Formulir_kliniksehat.html" method="get">
        <label for="nama"> Nama : </label>
        <input type="text" id="nama" name="nama"  />
        <br/><br/>

        <label for="password"> Password : </label>
        <input type="password" id="password" name="password" />
        <br/><br/>

        <label for="alamat"> Alamat : </label>
        <textarea id="alamat" name="alamat" rows="4" cols="30"></textarea>
        <br/><br/>

        Jenis Kelamin :
        <input type="radio" name="jenis_kelamin" value="laki-laki" checked/> 
        Laki-Laki
        <input type="radio" name="jenis_kelamin" value="perempuan" />
        Perempuan
        <br/><br/>

        Keluhan :
        <input type="checkbox" name="demam" checked /> Demam
        <input type="checkbox" name="batuk" /> Batuk
        <input type="checkbox" name="pusing" /> Pusing
        <br/><br/>

        <label for="status"> Status : </label>
        <select id="status" name="status">
            <option value="bpjs"> BPJS </option>
            <option value="umum" selected > Umum </option>
        </select>
        <br/><br/>

        <label for="komentar"> Komentar Anda : </label>
        <br/>
        <textarea id="komentar" name="komentar" rows="5" cols="20"></textarea>
        <br/><br/>
        
        <input type="submit" value="Mulai Proses!">
    </form>
</body>
</html>
